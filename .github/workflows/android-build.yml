name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Apply HSE Mentor launcher icon
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "store-assets/android-icons/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "store-assets/android-icons/mipmap-${density}/ic_launcher_round.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build Play Store release bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Mentor-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Upload unsigned Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Mentor-Unsigned-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Create signed Play Store release package
        run: |
          mkdir -p play-release
          openssl rand -base64 24 | tr -d '\n' > play-release/upload-key-password.txt
          keytool -genkeypair -v \
            -keystore play-release/hse-mentor-upload-key.jks \
            -storepass "$(cat play-release/upload-key-password.txt)" \
            -keypass "$(cat play-release/upload-key-password.txt)" \
            -alias hse-mentor-upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HSE Mentor, OU=Mobile Apps, O=Kamran Butt, L=Riyadh, ST=Riyadh, C=SA"
          cp android/app/build/outputs/bundle/release/app-release.aab play-release/HSE-Mentor-v1.0.0-build1-signed.aab
          jarsigner \
            -keystore play-release/hse-mentor-upload-key.jks \
            -storepass "$(cat play-release/upload-key-password.txt)" \
            -keypass "$(cat play-release/upload-key-password.txt)" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            play-release/HSE-Mentor-v1.0.0-build1-signed.aab hse-mentor-upload
          jarsigner -verify play-release/HSE-Mentor-v1.0.0-build1-signed.aab
          keytool -list -v \
            -keystore play-release/hse-mentor-upload-key.jks \
            -storepass "$(cat play-release/upload-key-password.txt)" \
            -alias hse-mentor-upload > play-release/upload-key-certificate.txt
      - name: Upload signed Play Store release and key backup
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Mentor-Play-Release
          path: play-release
          retention-days: 7
